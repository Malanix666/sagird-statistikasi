# Material UI Theme for Streamlit — Dark (Material 3)
# Google's Material Design 3 dark color scheme

[theme]
base = "dark"
primaryColor = "#D0BCFF"
backgroundColor = "#141218"
secondaryBackgroundColor = "#211F26"
codeBackgroundColor = "#2B2930"
textColor = "#E6E0E9"
linkColor = "#D0BCFF"
borderColor = "#49454F"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "16px"
buttonRadius = "full"
font = "'Roboto':https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
codeFont = "'Roboto Mono':https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
codeFontSize = "14px"
codeTextColor = "#E6E0E9"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["36px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [400, 400, 500, 500, 500, 500]
linkUnderline = false
# Material 3 dark color system (high contrast on dark background)
chartCategoricalColors = ["#D0BCFF", "#EFB8C8", "#BE9EE5", "#FFB4AB", "#4DD0E1", "#86EFAC", "#FFD666"]

# Material 3 dark palette
violetColor = "#D0BCFF"
redColor = "#FFB4AB"
greenColor = "#86EFAC"
blueColor = "#4DD0E1"
orangeColor = "#FFD666"
yellowColor = "#FFF59D"

dataframeBorderColor = "#49454F"
dataframeHeaderBackgroundColor = "#2B2930"

[theme.sidebar]
backgroundColor = "#1D1B20"
secondaryBackgroundColor = "#211F26"
codeBackgroundColor = "#2B2930"
borderColor = "#49454F"